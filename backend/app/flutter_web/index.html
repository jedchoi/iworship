<!DOCTYPE html>
<html>
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="명선교회 청·장년 말씀 묵상 및 주보 앱 - 명선아이워십">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="명선아이워십">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>명선아이워십</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #5C7B9E;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #native-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #5C7B9E;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .contain-splash-img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
    }
  </style>
</head>
<body>
  <!-- Full Centered Native Web Splash Screen with matching sky blue background -->
  <div id="native-splash">
    <img src="splash_cover.png" class="contain-splash-img" alt="명선아이워십 로딩 표지">
  </div>

  <script>
    // Remove native splash overlay as soon as Flutter Web app starts rendering
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('native-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      }
    });

    // Safety fallback: auto hide splash after 3 seconds if event didn't fire
    setTimeout(function() {
      var splash = document.getElementById('native-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      }
    }, 3000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
